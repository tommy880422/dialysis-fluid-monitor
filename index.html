<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>居家水分監測</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：仿 iOS 26 的單欄 App。大標題、灰底配白色圓角分組清單、膠囊按鈕、底部懸浮玻璃分頁列 */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --ink:#000000; --muted:#8A8A8E; --sep:#C6C6C8; --fill:#7676801f;
  --accent:#0088FF; --green:#34C759; --orange:#FF9500; --red:#FF383C;
  --green-soft:#E3F7E8; --orange-soft:#FFF1DC; --red-soft:#FFE5E5; --orange-ink:#B26300;
  --glass:#FFFFFFB8; --glass-line:#FFFFFFE6; --shadow:0 8px 24px #0000001f;
  --band:#0088FF1a; --dial:#76768014;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --ink:#FFFFFF; --muted:#98989F; --sep:#38383A; --fill:#7676803d;
  --accent:#0091FF; --green:#30D158; --orange:#FF9F0A; --red:#FF4245;
  --green-soft:#12301B; --orange-soft:#3A2A10; --red-soft:#3A1416; --orange-ink:#FFB340;
  --glass:#2C2C2EB8; --glass-line:#FFFFFF26; --shadow:0 8px 24px #00000080;
  --band:#0091FF2e; --dial:#ffffff0f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --ink:#FFFFFF; --muted:#98989F; --sep:#38383A; --fill:#7676803d;
  --accent:#0091FF; --green:#30D158; --orange:#FF9F0A; --red:#FF4245;
  --green-soft:#12301B; --orange-soft:#3A2A10; --red-soft:#3A1416; --orange-ink:#FFB340;
  --glass:#2C2C2EB8; --glass-line:#FFFFFF26; --shadow:0 8px 24px #00000080;
  --band:#0091FF2e; --dial:#ffffff0f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(120px + env(safe-area-inset-bottom,0px))}
.language-picker{display:flex;justify-content:flex-end;margin-bottom:12px}
.language-picker .seg button{min-height:44px;padding-inline:12px}
h1,h2,h3,p{margin:0}
h1{font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.2;text-wrap:balance}
h2{font-size:22px;font-weight:700;text-wrap:balance}
.view{display:flex;flex-direction:column;gap:22px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.foot{font-size:13px;color:var(--muted);padding:0 16px}
/* 頂端列與大標題 */
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.gbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--ink);cursor:pointer;text-decoration:none;font:inherit;padding:0}
.gbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spacer{width:44px;height:44px}
.lt .date{font-size:13px;font-weight:500;color:var(--muted)}
/* 卡片與分組清單 */
.card{background:var(--surface);border-radius:24px;padding:18px}
.group{display:flex;flex-direction:column;gap:6px}
.gh{font-size:13px;font-weight:500;color:var(--muted);padding:0 16px}
.list{background:var(--surface);border-radius:24px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:52px;position:relative;color:inherit;text-decoration:none;width:100%;background:none;border:0;font:inherit;text-align:left}
button.row,a.row{cursor:pointer}
button.row:active,a.row:active{background:var(--fill)}
.row + .row::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
.row.ic + .row::before,.row + .row.ic::before{left:58px}
.row .main{flex:1;min-width:0}
.row .t{font-size:16px}
.row .s{font-size:13px;color:var(--muted)}
.row .v{font-size:16px;color:var(--muted);white-space:nowrap}
.row .v.strong{color:var(--ink);font-weight:600}
.row.dim .t{color:var(--muted)}
.icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chev{width:8px;height:14px;flex:none;stroke:var(--sep);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.check{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{font-family:var(--f-num);font-weight:600;font-size:15px;padding:3px 10px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.b-red{background:var(--red-soft);color:var(--red)} .b-orange{background:var(--orange-soft);color:var(--orange-ink)} .b-green{background:var(--green-soft);color:var(--green)} .b-gray{background:var(--fill);color:var(--muted)}
.ev{display:inline-block;margin-top:4px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px}
a{color:var(--accent);text-decoration:none}
/* 狀態卡 */
.status .top{display:flex;align-items:center;gap:12px}
.status .ring{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none}
.status .ring svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.status .lab{font-size:13px;font-weight:700}
.status .tt{font-size:20px;font-weight:700}
.status .score{text-align:right}
.status .score b{display:block;font-family:var(--f-num);font-size:34px;line-height:1;font-weight:700}
.status .score span{font-size:11px;color:var(--muted)}
.status .sub{font-size:13px;color:var(--muted);margin-top:10px}
.lv-green .ring{background:var(--green)} .lv-green .lab,.lv-green .score b{color:var(--green)}
.lv-yellow .ring{background:var(--orange)} .lv-yellow .lab,.lv-yellow .score b{color:var(--orange)}
.lv-red .ring{background:var(--red)} .lv-red .lab,.lv-red .score b{color:var(--red)}
.lv-none .ring{background:var(--fill)}
/* 按鈕 */
.btns{display:flex;flex-direction:column;gap:10px}
.cap{font:inherit;font-size:17px;font-weight:600;border:0;border-radius:999px;min-height:50px;padding:0 20px;cursor:pointer;background:var(--fill);color:var(--accent);width:100%;display:flex;align-items:center;justify-content:center;text-decoration:none}
.cap.pro{background:var(--accent);color:#fff;min-height:56px}
.cap.red{color:var(--red)}
.cap[disabled]{opacity:.4;cursor:not-allowed}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cap:focus-visible,.gbtn:focus-visible,.row:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,.face:focus-visible,.tabbar a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* 提示 */
.tip{border-radius:18px;padding:12px 16px;font-size:15px;background:var(--surface)}
.tip.warn{background:var(--orange-soft)}
.tip.bad{background:var(--red-soft)}
/* 分段控制 */
.seg{display:flex;background:var(--fill);border-radius:999px;padding:3px}
.seg button{flex:1;font:inherit;font-size:14px;font-weight:500;border:0;background:none;color:var(--ink);border-radius:999px;padding:7px 0;cursor:pointer}
.seg button.on{background:var(--surface);font-weight:700;box-shadow:0 2px 6px #0000001a}
/* 表單 */
.row input[type=number],.row input[type=text],.row input[type=password],.row select{font:inherit;font-family:var(--f-num);font-size:20px;border:0;background:none;color:var(--ink);text-align:right;width:8.5em;min-width:0;padding:4px 0}
.row input[type=text],.row select{font-family:var(--f);font-size:16px;color:var(--muted)}
.row input::placeholder{color:var(--sep)}
.switch{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:999px;background:var(--fill);position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #00000040;transition:transform .2s}
.switch:checked{background:var(--green)}
.switch:checked::after{transform:translateX(20px)}
.progress{height:6px;border-radius:999px;background:var(--fill);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px}
.faces{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.face{font:inherit;border:0;background:var(--surface);color:var(--ink);border-radius:16px;padding:10px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:70px}
.face b{font-family:var(--f-num);font-size:22px}
.face small{font-size:10px;color:var(--muted);text-align:center;line-height:1.2}
.face.sel{background:var(--accent);color:#fff}
.face.sel small{color:#ffffffcc}
.timer{font-family:var(--f-num);font-size:48px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
ol.howto{margin:0;padding-left:1.3em;font-size:15px;display:flex;flex-direction:column;gap:4px}
/* 圖表 */
svg.chart text{fill:var(--muted);font-family:var(--f-num);font-size:11px}
.bignum{display:flex;align-items:baseline;gap:4px}
.bignum b{font-family:var(--f-num);font-size:30px;font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
/* 底部懸浮玻璃分頁列 */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:5px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);z-index:20;max-width:calc(100% - 24px)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 12px;border-radius:999px;color:var(--ink);font-size:10px;font-weight:500;text-decoration:none;min-width:56px}
.tabbar a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{background:var(--fill);color:var(--accent);font-weight:700}
@media (max-width:360px){.tabbar a{min-width:0;padding:6px 8px}}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .2s ease-out}@keyframes fade{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>

/* ---------- 資料與儲存 ---------- */
const KEY = "fluid-monitor-v1";
const LANGUAGE_KEY = "fluid-monitor-language";
let language = "zh-Hant";
try { if(localStorage.getItem(LANGUAGE_KEY)==="en") language="en"; } catch(e) {}

// Numbered placeholders let translations reorder values while keeping the same data.
function t(message, ...values){
  const template = language==="en" ? EN[message] ?? message : message;
  return template.replace(/\{(\d+)\}/g, (_, index)=>values[index]);
}

const DAY = 864e5;
let state = load() || demoState();
let ui = { step:0, draft:null, lastId:null, metric:"lw", resetArm:false, timerEnd:0 };

function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

function demoProfile(){
  return { height:165, target:68, schedule:"135", fistula:"left", pacerRight:false, effusion:false, rater:"女兒", dyspBase:null, demo:true };
}
function demoState(){
  const now = Date.now(), today0 = new Date(); today0.setHours(0,0,0,0);
  const t0 = today0.getTime();
  const posts = [-14,-12,-10,-7,-5,-2];
  const postLw = [25,26,26,25,26,26], postSkin=[24,23.5,24.5,24,23.8,24.2];
  const recs = []; let id = 1;
  const tri = m => [ +(m-0.6).toFixed(1), +(m+0.4).toFixed(1), +(m+0.3).toFixed(1) ];
  for(let d=-14; d<=0; d++){
    const pi = posts.indexOf(d);
    if(pi>=0){
      recs.push({id:id++, ts:t0+d*DAY+13.5*36e5, type:"post", weight:68.3, sbp:132, dbp:74, hr:72,
        skin:tri(postSkin[pi]), lw:postLw[pi], rater:"女兒", dysp:1, waited:false, remeasured:false});
    } else if(d===-1){
      recs.push({id:id++, ts:t0+d*DAY+8*36e5, type:"home", weight:71.2, sbp:150, dbp:84, hr:80,
        skin:tri(27), lw:31, rater:"女兒", dysp:2, waited:false, remeasured:false});
    } else if(d===0){
      recs.push({id:id++, ts:Math.min(now-36e5, t0+8*36e5), type:"home", weight:72.3, sbp:158, dbp:88, hr:86,
        skin:tri(31), lw:36, rater:"女兒", dysp:3, waited:true, remeasured:true});
    } else {
      const w = 69.4 + ((d+14)%3)*0.2;
      recs.push({id:id++, ts:t0+d*DAY+8*36e5, type:"home", weight:+w.toFixed(1), sbp:140, dbp:80, hr:76,
        skin:tri(25+((d+14)%2)*0.6), lw:28, rater:"女兒", dysp:1, waited:false, remeasured:false});
    }
  }
  return { profile:demoProfile(), records:recs, nextId:id };
}

/* ---------- 計算 ---------- */
const mean = a => a.reduce((s,x)=>s+x,0)/a.length;
function cv(a){ const m=mean(a); if(!m) return 0; const sd=Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1)); return sd/m*100; }
const bmi = p => p.target / ((p.height/100)**2);
function redsStatus(p){
  const reasons=[];
  if(p.height<155||p.height>190) reasons.push(t("身高不在 155–190 cm"));
  const b=bmi(p); if(b<22||b>38) reasons.push(t("BMI {0} 不在 22–38", b.toFixed(1)));
  if(p.pacerRight) reasons.push(t("右胸有心律調節器"));
  return { usable:reasons.length===0, reasons, scored:reasons.length===0 && !p.effusion };
}
const sorted = () => [...state.records].sort((a,b)=>a.ts-b.ts);
/* 個人基準：前 6 次透析後量測是校正期；之後用最近 6 次的平均，門檻 = max(4 點, 2 × 標準差) */
const CALIB_N = 6;
const sd = a => a.length<2 ? 0 : Math.sqrt(a.reduce((s,x)=>s+(x-mean(a))**2,0)/(a.length-1));
function baseline(rec){
  const all = state.records.filter(r=>r.type==="post" && r.ts<rec.ts).sort((a,b)=>b.ts-a.ts);
  if(all.length<CALIB_N) return { calib:true, n:all.length };
  const posts = all.slice(0,CALIB_N), lws = posts.map(r=>r.lw).filter(v=>v!=null);
  const lw = lws.length>=3 ? mean(lws) : null, s = lws.length>=3 ? sd(lws) : null;
  return { calib:false, n:all.length, lw, sd:s, thr: s==null ? 4 : Math.max(4, 2*s), skin: mean(posts.map(r=>mean(r.skin))) };
}
function evaluate(rec){
  const p=state.profile, base=baseline(rec), rs=redsStatus(p), items=[], notes=[];
  let forced=false;
  if(rec.lw==null){
    items.push({k:t("肺水 %LW"), d: rs.usable ? t("這次沒有量") : t("不適用 ReDS：")+rs.reasons.join(t("、")), pts:0, off:true});
  } else if(!rs.scored){
    items.push({k:t("肺水 %LW"), d:t("{0}%（只顯示，不計分）", rec.lw), pts:0, off:true});
    notes.push(p.effusion ? t("設定中標示有肋膜積水，ReDS 數值可能假性偏高，所以這次肺水不列入計分。") : t("ReDS 使用資格不符，肺水不列入計分。"));
  } else {
    const calib = base.calib;
    if(rec.lw>=35) items.push({k:t("肺水 %LW ≥ 35%（安全底線）"), d:`${rec.lw}%`, pts:2});
    else if(!calib && rec.lw>=26.5) items.push({k:t("肺水 %LW 26.5–34.9%"), d:t("{0}%（透析族群門檻）", rec.lw), pts:1});
    else items.push({k:t("肺水 %LW"), d: calib ? t("{0}%（校正期只看 35% 安全底線）", rec.lw) : t("{0}%，低於 26.5%", rec.lw), pts:0, off:calib});
    if(!calib && base.lw!=null){
      const dl = rec.lw-base.lw, why = 2*base.sd>4 ? t("您的波動較大，用 2 倍波動 {0} 點", (2*base.sd).toFixed(1)) : t("儀器誤差 4 點（您的 2 倍波動 {0} 點較小）", (2*base.sd).toFixed(1));
      items.push({k:t("肺水比個人基準高 ≥ {0} 點", base.thr.toFixed(1)), d:t("基準 {0}%，差 {1}{2} 點；門檻取{3}", base.lw.toFixed(1), dl>=0?"+":"", dl.toFixed(1), why), pts: dl>=base.thr?1:0});
    }
  }
  const calib = base.calib;
  const over = rec.weight - p.target;
  if(over>=4) items.push({k:t("比目標體重多 ≥ 4 kg（安全底線）"), d:t("+{0} kg（目標 {1} kg）", over.toFixed(1), p.target), pts:2});
  else items.push({k:t("比目標體重多"), d:t("{0}{1} kg（目標 {2} kg）{3}", over>=0?"+":"", over.toFixed(1), p.target, calib&&over>=3?t("，校正期不用 3 kg 門檻"):""), pts: !calib&&over>=3?1:0});
  if(rec.dysp>=7){ forced=true; items.push({k:t("喘的程度 ≥ 7 分"), d:t("{0} 分，直接紅燈", rec.dysp), pts:0, forced:true}); }
  else if(p.dyspBase!=null) items.push({k:t("喘比平常多 ≥ 2 分"), d:t("今天 {0} 分，平常 {1} 分（醫護設定）", rec.dysp, p.dyspBase), pts: rec.dysp>=p.dyspBase+2?2:0});
  else items.push({k:t("喘的程度 4–6 分"), d:t("{0} 分", rec.dysp), pts: rec.dysp>=4?2:0});
  const sm = mean(rec.skin), others = items.reduce((s,i)=>s+i.pts,0) > 0;
  if(!calib){
    const up = (sm/base.skin-1)*100, hit = up>=20;
    items.push({k:t("皮膚水分比基準高 ≥ 20%"), d:t("平均 {0}，基準 {1}（{2}{3}%）{4}", sm.toFixed(1), base.skin.toFixed(1), up>=0?"+":"", up.toFixed(0), hit&&!others?t("，沒有其他指標有分，不計入"):""),
      pts: hit&&others?1:0, off: hit&&!others});
  } else {
    items.push({k:t("皮膚水分"), d:t("平均 {0}（校正期，只記錄）", sm.toFixed(1)), pts:0, off:true});
  }
  items.push({k:t("血壓、心跳"), d:t("{0}/{1} mmHg，{2} 次/分（只記錄，不計分）", rec.sbp, rec.dbp, rec.hr), pts:0, off:true});
  if(calib) notes.push(t("校正期（透析後量測已完成 {0}／{1} 次）：只用安全底線判讀，也就是肺水 ≥ 35%、體重多 ≥ 4 kg、喘的程度。", base.n, CALIB_N));
  if(rec.rater && p.rater && rec.rater!==p.rater) notes.push(t("這次 ReDS 由「{0}」量，平常是「{1}」。換人量時數值較不穩定。", rec.rater, p.rater));
  const score = items.reduce((s,i)=>s+i.pts,0);

}

  box.innerHTML = `<div class="tip ${c>10?"warn":""}">${t("平均")} <b class="num">${mean(n).toFixed(1)}</b>・CV <b class="num">${c.toFixed(1)}%</b>${c>10?t("：差太多，請重量"):t("：讀數穩定")}</div>`;
}
let tick=null;
bind.measure = () => {
  const d=ui.draft;
  $("#cancel").onclick = () => { ui.draft=null; ui.step=0; go("home"); };
  if(ui.step===0){
    $("#hotNo").onclick = () => { d.hot=false; d.waited=false; ui.step=1; render(); };
    $("#hotYes").onclick = () => { d.hot=true; d.waited=true; ui.timerEnd=Date.now()+15*60e3; render(); };
    if(d.hot){
      $("#timerDone").onclick = () => { ui.step=1; render(); };
      $("#timerSkip").onclick = () => { ui.timerEnd=0; ui.step=1; render(); };
      clearInterval(tick); tick=setInterval(()=>{ const t=$("#timer"); if(!t||route()!=="measure"||ui.step!==0){clearInterval(tick);return;}
        const left=Math.max(0,Math.ceil((ui.timerEnd-Date.now())/1000)); t.textContent=`${String(Math.floor(left/60)).padStart(2,"0")}:${String(left%60).padStart(2,"0")}`;
        if(left===0){ $("#timerDone").disabled=false; clearInterval(tick);} },1000);
    }
    return;
  }
  const th=$("#t-home"), tp=$("#t-post");
  if(th){ th.onclick=()=>{ d.type="home"; render(); }; tp.onclick=()=>{ d.type="post"; render(); }; }
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ d.dysp=Number(b.dataset.d); render(); });
  if(ui.step===4){ [0,1,2].forEach(i=>$("#f-s"+i).addEventListener("input",cvMsg)); cvMsg(); }
  if(ui.step===5 && $("#f-rater")){
    const chk=()=>{ const v=$("#f-rater").value.trim(), p=state.profile.rater;
      $("#raterbox").innerHTML = v&&p&&v!==p ? `<div class="tip warn">${t("平常是「{0}」量。換人量時數值較不穩定，系統會記下這次換人。", esc(p))}</div>`:""; };
    $("#f-rater").addEventListener("input",chk); chk();
  }
  $("#back").onclick = () => { collect(); ui.step--; render(); };
  $("#next").onclick = () => {
    collect(); const e=validate();
    if(e){ $("#err").textContent=e; if(ui.step===4 && d.cvFail){ d.remeasured=true; } return; }
    if(ui.step<STEPS.length-1){ ui.step++; render(); return; }
    const rs = redsStatus(state.profile);
    const rec = { id:state.nextId++, ts:Date.now(), type:d.type, weight:Number(d.weight), sbp:Number(d.sbp), dbp:Number(d.dbp), hr:Number(d.hr),

};

/* ---------- 趨勢 ---------- */
const METRICS = {
  lw:{get t(){ return t("肺水"); },get full(){ return t("肺水 %LW"); }, u:"%", get:r=>r.lw, refs:[[26.5,"26.5%"],[35,"35%"]], band:b=>!b.calib&&b.lw!=null?[b.lw-b.thr,b.lw+b.thr]:null},
  skin:{get t(){ return t("皮膚水分"); },get full(){ return t("皮膚水分"); }, u:"a.u.", get:r=>+mean(r.skin).toFixed(1), refs:[], band:b=>!b.calib?[b.skin*0.8,b.skin*1.2]:null},
  weight:{get t(){ return t("體重"); },get full(){ return t("體重"); }, u:"kg", get:r=>r.weight, refs:[[null,"目標"]], band:()=>[state.profile.target, state.profile.target+3]}
};
const LVC = {green:"var(--green)", yellow:"var(--orange)", red:"var(--red)"};
function chart(key){
  const M=METRICS[key], recs=sorted().filter(r=>M.get(r)!=null);
  if(recs.length<2) return `<p class="muted">${t("資料還不夠畫圖。")}</p>`;
  const W=640,H=260,pl=34,pr=10,pt=12,pb=26;
  const t0=new Date(recs[0].ts); t0.setHours(0,0,0,0); const tA=t0.getTime();
  const t1=new Date(recs[recs.length-1].ts); t1.setHours(24,0,0,0); const tB=t1.getTime();
  const base=baseline({ts:Date.now()+1}), band=M.band(base);
  const refs=M.refs.map(([v,l])=>[v==null?state.profile.target:v,t(l)]);
  let vals=recs.map(M.get).concat(refs.map(r=>r[0])); if(band) vals=vals.concat(band);
  let lo=Math.min(...vals), hi=Math.max(...vals); const pad=(hi-lo)*0.12||1; lo-=pad; hi+=pad;
  const x=t=>pl+(t-tA)/(tB-tA)*(W-pl-pr), y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  let g="";
  recs.filter(r=>r.type==="post").forEach(r=>{ const d=new Date(r.ts); d.setHours(0,0,0,0); const a=x(d.getTime()), b=x(d.getTime()+DAY); g+=`<rect x="${a+2}" y="${pt}" width="${b-a-4}" height="${H-pt-pb}" rx="6" fill="var(--dial)"/>`; });
  if(band) g+=`<rect x="${pl}" y="${y(band[1])}" width="${W-pl-pr}" height="${y(band[0])-y(band[1])}" rx="8" fill="var(--band)"/>`;
  const step = niceStep((hi-lo)/4);
  for(let v=Math.ceil(lo/step)*step; v<=hi; v+=step){ g+=`<text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${+v.toFixed(1)}</text>`; }
  refs.forEach(([v,l])=>{ g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/><text x="${W-pr-2}" y="${y(v)-5}" text-anchor="end">${l}</text>`; });
  for(let t=tA; t<tB; t+=DAY*2){ g+=`<text x="${x(t+DAY/2)}" y="${H-6}" text-anchor="middle">${md(t)}</text>`; }
  g+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" points="${recs.map(r=>`${x(r.ts).toFixed(1)},${y(M.get(r)).toFixed(1)}`).join(" ")}"/>`;
  recs.forEach((r,i)=>{ const ev=evaluate(r), last=i===recs.length-1;
    g+=`<circle cx="${x(r.ts)}" cy="${y(M.get(r))}" r="${last?7:4.5}" fill="${LVC[ev.level]}" stroke="var(--surface)" stroke-width="2"><title>${t("{0} {1}：{2} {3}（{4}）", md(r.ts), hm(r.ts), M.get(r), M.u, LV[ev.level].t)}</title></circle>`; });
  return `<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${t("{0}趨勢圖", M.full)}">${g}</svg></div>`;
}
function niceStep(r){ const p=10**Math.floor(Math.log10(r)), m=r/p; return (m<1.5?1:m<3?2:m<7?5:10)*p; }
function trend(){
  const M=METRICS[ui.metric], base=baseline({ts:Date.now()+1}), last=sorted().filter(r=>M.get(r)!=null).pop();

  <div class="seg" role="tablist">${Object.entries(METRICS).map(([k,m])=>`<button class="${k===ui.metric?"on":""}" data-m="${k}" role="tab" aria-selected="${k===ui.metric}">${m.t}</button>`).join("")}</div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px">

}

  const baseRows = b.calib
    ? row({t:t("狀態"), v:t("校正期 {0}／{1} 次", b.n, CALIB_N), strong:true})
    : row({t:t("狀態"), v:t("已建立"), strong:true}) + row({t:t("肺水基準"), v: b.lw!=null?`${b.lw.toFixed(1)}%`:"—"}) + row({t:t("肺水波動（標準差）"), v: b.sd!=null?t("{0} 點", b.sd.toFixed(1)):"—"})
      + row({t:t("肺水個人門檻"), s:t("4 點或 2 倍波動，取較大者"), v:t("±{0} 點", b.thr.toFixed(1)), strong:true}) + row({t:t("皮膚水分基準"), v:b.skin.toFixed(1)});
  return `${topbar({href:"#home",label:t("返回首頁"),icon:P.back},null)}
  ${title("",t("設定"))}
  <form id="pf" class="view" style="gap:22px">
    ${group(t("基本資料"), inRow("p-h",t("身高"),p.height,{unit:"cm",step:"1"}) + row({t:t("BMI（以目標體重計）"), v:bmi(p).toFixed(1)}))}
    ${group(t("透析"), sel("p-s",t("透析日"),[["135",t("一、三、五")],["246",t("二、四、六")]],p.schedule) + sel("p-f",t("瘻管在哪一手"),[["left",t("左手（量右手）")],["right",t("右手（量左手）")]],p.fistula))}
    ${group("ReDS", inRow("p-r",t("平常誰幫忙量"),p.rater,{type:"text",ph:t("例如：女兒")}) + sw("p-pm",t("右胸有心律調節器"),p.pacerRight),
      rs.usable ? (p.effusion?t("可以使用 ReDS，但肺水只顯示、不計分。"):t("可以使用 ReDS。")) : t("不適用 ReDS：")+esc(rs.reasons.join(t("、"))))}
    ${group(t("醫護設定"), staffRows, ui.staff ? t("修改後按「儲存設定」。這些項目屬於臨床判斷，由透析室的醫護人員設定。") : t("這些項目屬於臨床判斷，由透析室的醫護人員設定。"))}
    ${group(t("個人基準（自動計算）"), baseRows, t("用最近 {0} 次透析後的量測計算。前 {1} 次是校正期，只用安全底線判讀。", CALIB_N, CALIB_N))}
    <button class="cap pro" type="submit">${t("儲存設定")}</button>
    <p class="foot" id="saved" role="status"></p>
  </form>
  ${group(t("示範資料"), row({btn:"demo", t:t("載入示範資料"), tcol:"var(--accent)"}) + row({btn:"clear", t: ui.resetArm?t("再按一次確認清除"):t("清除所有紀錄"), tcol:"var(--red)"}),
    t("示範資料有兩週的紀錄，可以看到「綠燈 → 長間隔第一天黃燈 → 今天紅燈」的過程。"))}`;
}
bind.setup = () => {
  $("#pf").onsubmit = e => { e.preventDefault(); const p=state.profile;
    p.height=Number($("#p-h").value)||p.height; p.schedule=$("#p-s").value; p.fistula=$("#p-f").value;
    p.rater=$("#p-r").value.trim(); p.pacerRight=$("#p-pm").checked;
    if(ui.staff){ p.target=Number($("#p-t").value)||p.target; const v=$("#p-db").value; p.dyspBase = v==="" ? null : Number(v); p.effusion=$("#p-pe").checked; }
    save(); render(); $("#saved").textContent=t("已儲存"); };
  const un=$("#unlock"); if(un) un.onclick = () => { if($("#pin").value==="1234"){ ui.staff=true; render(); } else { $("#saved").textContent=t("密碼不正確（示範密碼 1234）"); } };
  const lk=$("#lock"); if(lk) lk.onclick = () => { ui.staff=false; render(); };
  $("#demo").onclick = () => { state=demoState(); ui.resetArm=false; save(); go("home"); };
  $("#clear").onclick = () => { if(!ui.resetArm){ ui.resetArm=true; render(); return; }
    ui.resetArm=false; state={ profile:{...state.profile, demo:false}, records:[], nextId:1 }; save(); go("home"); };
};

renderLanguage();
</script>
</body>
</html>
